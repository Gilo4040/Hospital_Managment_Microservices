
services:
  doctoranddepartmant.api:
    image: doctoranddepartmantapi
    build:
      context: .
      dockerfile: services/Doctorand/DoctorandDepartmant.api/Dockerfile
    ports:
       - "5116:8080"
    depends_on:
     - sqlserver
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=DoctorAndDepartmant;User Id=sa;Password=StrongPassword123!;TrustServerCertificate=True;
    restart: always

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver2022
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=StrongPassword123!
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "sleep 10; /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'StrongPassword123!' -Q 'SELECT 1'"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: always
  patient.api:
   image: ${DOCKER_REGISTRY-}patientapi
   build:
    context: .
    dockerfile: services/Patient.Service/Patient.Api/Dockerfile
   ports:
    - "5261:8080"
   depends_on:
    - postgres
      
   environment:
    - ASPNETCORE_ENVIRONMENT=Development
    - ASPNETCORE_URLS=http://+:8080
    - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=PatientDB;Username=postgres;Password=123456
   restart: always
 
  postgres:
   image: postgres:15
   container_name: postgres_db
   environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: 123456
    POSTGRES_DB: PatientDB
   ports:
    - "5432:5432"
   volumes:
    - postgres_data:/var/lib/postgresql/data
   restart: always
   healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d PatientDB"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 10s

volumes:
  sqlserver_data:
  postgres_data:


